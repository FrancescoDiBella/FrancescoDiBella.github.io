[package]
name = "repo-hub"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "repo-hub"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "39301f6793266450a057f270da06b048a689be96" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "native-certs", "proxy-from-env"] }
serde_json = "1"
