# Builds the RepoHub Docker image and publishes it to GitHub Container Registry
# (ghcr.io/<owner>/repohub) whenever repohub/ changes on main.
name: RepoHub image

on:
  push:
    branches: [main]
    paths: ["repohub/**", ".github/workflows/repohub-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repohub" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: repohub
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
